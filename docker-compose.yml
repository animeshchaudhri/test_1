version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - voice-ecommerce-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - QDRANT_URL=http://qdrant:6333
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DATABASE=voice_ecommerce
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
      - qdrant
    networks:
      - voice-ecommerce-network
    volumes:
      - ./data:/app/data

  # MongoDB Service
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - voice-ecommerce-network

  # Qdrant Service
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - voice-ecommerce-network

networks:
  voice-ecommerce-network:
    driver: bridge

volumes:
  mongodb-data:
  qdrant-data:
